apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
        
        envFrom:
        - secretRef:
            name: postgres-secret
        
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "12Gi"
        
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql
        
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "user", "-d", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "user", "-d", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
      
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc 
