apiVersion: v1
kind: Service
metadata:
  name: scylladb-headless
  namespace: scylladb
spec:
  clusterIP: None
  selector:
    app: scylladb
  ports:
  - port: 9042
    targetPort: 9042
    protocol: TCP
    name: cql
  - port: 7000
    targetPort: 7000
    protocol: TCP
    name: intra-node
  - port: 7001
    targetPort: 7001
    protocol: TCP
    name: tls-intra-node

