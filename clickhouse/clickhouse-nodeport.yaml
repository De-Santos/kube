apiVersion: v1
kind: Service
metadata:
  name: clickhouse-nodeport
  namespace: clickhouse
spec:
  type: NodePort
  selector:
    app: clickhouse
  ports:
  - port: 8123
    targetPort: 8123
    nodePort: 30123
    protocol: TCP
    name: http
  - port: 8200
    targetPort: 8200
    nodePort: 30912
    protocol: TCP
    name: native
